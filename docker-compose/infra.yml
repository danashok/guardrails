services:
  db_app:
    image: postgres:18-alpine
    container_name: guardrails_db
    env_file:
      - ../.env
    volumes:
      - guardrails_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-net

volumes:
  guardrails_pg_data:

networks:
  litellm-net:
    name: litellm-net
    external: true
